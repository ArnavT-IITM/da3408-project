name: aircast

x-backend: &backend
  image: aircast-backend:local
  build: .
  init: true
  restart: unless-stopped
  environment: &environment
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_SERVER_URL: http://model-server:5001
    MLFLOW_PUBLIC_URL: http://localhost:${AIRCAST_MLFLOW_PORT:-15000}
    GRAFANA_PUBLIC_URL: http://localhost:${AIRCAST_GRAFANA_PORT:-13000}/d/aircast/aircast-operations
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    SPARK_LOCAL_IP: 127.0.0.1
  working_dir: /app

services:
  frontend:
    image: aircast-frontend:local
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRCAST_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${AIRCAST_HTTPS_PORT:-8443}:443"
    environment:
      AIRCAST_HTTPS_PORT: ${AIRCAST_HTTPS_PORT:-8443}
      AIRCAST_API_URL: ${AIRCAST_API_URL:-/api}
      NGINX_ENVSUBST_FILTER: AIRCAST_HTTPS_PORT
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    <<: *backend
    command: [uvicorn, "app.api:app", --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:${AIRCAST_API_PORT:-18000}:8000"
    # DVC executes against this versioned workspace, not an unrelated copy.
    volumes:
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  model-server:
    <<: *backend
    command: [python, -m, app.serve]
    volumes:
      - ./data:/app/data:ro
      - ./state:/app/state
      - ./artifacts:/app/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
    # Until the first model passes evaluation this deliberately reports unready.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3

  mlflow:
    <<: *backend
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////app/state/mlflow.db
      - --artifacts-destination
      - /app/artifacts/mlflow
      - --serve-artifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"
    volumes:
      - ./state:/app/state
      - ./artifacts:/app/artifacts
    ports:
      - "127.0.0.1:${AIRCAST_MLFLOW_PORT:-15000}:5000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${AIRCAST_PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/healthy]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_METRICS_ENABLED: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${AIRCAST_GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 3s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --no-collector.filesystem
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9100/metrics]
      interval: 10s
      timeout: 3s
      retries: 3

  checks:
    <<: *backend
    profiles: [tools]
    restart: "no"
    volumes:
      - .:/app
    command: [sh, -c, "mkdir -p artifacts && ruff check app tests scripts && ruff format --check app tests scripts && python -m pytest -q --junitxml=artifacts/tests.xml --html=artifacts/tests.html --self-contained-html"]

volumes:
  prometheus-data:
  grafana-data:
