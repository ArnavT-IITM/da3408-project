# Lecture 9's pull model, using Compose service DNS instead of host IP addresses.
global:
  scrape_interval: 2s
  scrape_timeout: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aircast
    static_configs:
      - targets: [api:8000]
  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: [localhost:9090]
  - job_name: grafana
    scrape_interval: 5s
    static_configs:
      - targets: [grafana:3000]
